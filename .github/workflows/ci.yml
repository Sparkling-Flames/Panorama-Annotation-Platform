name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: panorama_annotation
          POSTGRES_USER: panorama_annotation
          POSTGRES_PASSWORD: postgres-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/dev.lock
      - name: Install locked Python dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements/bootstrap.lock
          python -m pip install --require-hashes -r backend/requirements/dev.lock
      - name: Reject committed credentials
        run: python scripts/check_secrets.py
      - name: Validate OpenSpec scenario traceability
        run: python scripts/validate_openspec_traceability.py
      - name: Check Python formatting and lint
        run: |
          python -m ruff format --check backend scripts
          python -m ruff check backend scripts
      - name: Check Python types
        run: python -m mypy
      - name: Run Python security scans
        run: |
          python -m bandit -q -c pyproject.toml -r backend scripts
          pip-audit --local
      - name: Run backend tests
        run: python -m pytest backend -q
      - name: Verify PostgreSQL immutable records
        env:
          DJANGO_SECRET_KEY: "django-insecure-ci-postgres-only"
          PANORAMA_TEST_SQLITE: "0"
          POSTGRES_PASSWORD: postgres-test-password
        run: >-
          python -m pytest backend/tests/test_media_immutability_postgres.py
          backend/tests/identity/test_audit_event_immutability_postgres.py -q
          --ds=panorama_annotation.settings

  node-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:frontend
      - run: npm run test:e2e-runner
      - run: npm audit --audit-level=high
      - run: npm run openspec:validate

  browser-e2e:
    runs-on: ubuntu-latest
    needs: node-quality
    env:
      PANORAMA_E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/dev.lock
      - run: npm ci
      - name: Install locked Python dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements/bootstrap.lock
          python -m pip install --require-hashes -r backend/requirements/dev.lock
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
