schema: spec-driven

context: |
  项目：Panorama Annotation Platform，一个与 HOHONET 论文实验主线物理隔离的轻量级全景标注平台。
  当前阶段：只完成开发治理初始化；尚未批准任何平台业务实现。
  语言：需求、设计、任务和交付说明默认使用简体中文；规范关键词和代码标识可保留英文。
  治理：openspec/specs 是当前有效产品行为真源，openspec/changes 是待实施变更真源。ADR 只解释架构理由，不能覆盖 OpenSpec。
  协作：Codex 是唯一开发执行主体。Grill 仅在用户显式要求时进行需求质询，其讨论结果不是正式需求，确认后的决策必须写入 OpenSpec。
  质量：行为变更和缺陷修复采用 TDD；不得通过削弱断言、伪造夹具或绕过真实行为让测试通过。
  已知产品方向（不构成本阶段的实施授权）：标注者只编辑 2D 几何和元标签；3D 是只读派生视图；平台采用领域专用 canonical schema 和稳定 ID，不保证 Label Studio 导出形状兼容。当前 HOHONET/Label Studio 实验保持隔离；未来如需复用旧论文数据，只通过独立、一次性的离线转换 bundle 适配，具体边界由对应 change 明确。

rules:
  proposal:
    - 明确问题、目标、非目标、范围边界和用户确认门槛。
    - 相关时评估权限隔离、数据兼容、迁移、失败恢复、安全、可观测性和全球访问影响。
    - 不得把 Grill 对话、ADR 或既有代码当作正式需求的替代品。
  specs:
    - 使用可测试的规范性表述，并为正常路径、异常路径和恢复路径给出场景。
    - 涉及数据时明确标识、版本、坐标、可变性、审计和兼容合同；不得默认为 Label Studio 数据形状完全不变。
    - 只描述产品行为，不夹带未批准的实现方案。
  design:
    - 说明关键权衡、边界、失败模式、数据流和验证策略，并逐条追溯到规范要求。
    - 相关时将可编辑的 2D/元标签规范状态与只读 3D、统计和分析派生物分离。
    - ADR 只能补充难以逆转且存在真实权衡的架构理由，不能改变规范要求。
  tasks:
    - 按 TDD 顺序安排：先写失败测试，再做最小实现，随后重构并运行回归验证。
    - 每项任务必须能追溯到规范或设计，并写明可验证的完成证据。
    - 用户确认 proposal/specs/design/tasks 之前不得开始业务实现。
